name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Native browser qualification runs locally in headed Edge with WebGPU.
      # Those scenarios also use local Hope Valley data, not distributed here.
      # CI does not claim GPU, folder-picker or player acceptance.
